[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localshare"
version = "2.0.0"
description = "High-Speed Encrypted Mesh File & Text Sharing Terminal Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pymongo>=4.6.0",
    "cryptography>=42.0.0",
    "qrcode>=8.0",
    "mcp>=1.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
localshare = "main:main"
