[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localshare"
version="2.0.0"
description = "High-Speed Encrypted Mesh File & Text Sharing Terminal Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
localshare = "main:main"
