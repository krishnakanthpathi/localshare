[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localshare"
version = "2.1.0"
description = "High-Speed Encrypted Mesh File & Text Sharing Terminal Application with Virtual KVM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
    "customtkinter>=6.0.0",
    "darkdetect>=0.8.0",
    "pillow>=10.0.0",
    "pynput>=1.7.6",
]

[project.scripts]
localshare = "main:main"
